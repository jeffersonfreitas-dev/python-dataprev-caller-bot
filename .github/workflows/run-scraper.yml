name: Run DataPrev Scraper

on:
  schedule:
    - cron: '0 18 * * *'  # Daily at 18 AM UTC
  workflow_dispatch:      # Manual trigger
  push:
    branches: [ main ]    # Run on push for testing

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Add permissions for pushing changes
    permissions:
      contents: write

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for proper diff

    - name: 🐍 Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          chromium-browser \
          chromium-chromedriver

    - name: 🔧 Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🚀 Run DataPrev scraper
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        DATAPREV_URL: ${{ secrets.DATAPREV_URL }}
      run: |
        python main.py

    - name: 📊 Check for CSV changes
      id: check_changes
      run: |
        echo "Checking for file changes..."
        git add database.csv
        git diff --cached --name-only --exit-code database.csv && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT
        echo "Changed status: $(echo ${{ steps.check_changes.outputs.changed }})"

    - name: 💾 Commit and push CSV changes
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        # Configure git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add CSV file
        git add database.csv
        
        # Commit with timestamp
        commit_message="🤖 Update database.csv - $(date +'%Y-%m-%d %H:%M:%S UTC')"
        git commit -m "$commit_message"
        
        # Push changes
        git push
        echo "✅ CSV file updated and pushed to repository"

    - name: 📝 Log if no changes
      if: steps.check_changes.outputs.changed == 'false'
      run: |
        echo "📋 No changes in data.csv"
        echo "✅ File is already up to date"

    - name: 📦 Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scraper-files
        path: |
          database.csv
          scraper_results.json
          *.log
        retention-days: 7